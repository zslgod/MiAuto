name: Android CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. a new push to an open PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only; this workflow needs no write scopes and touches no secret beyond the optional
# SDK dex below, so it runs unchanged on pull requests opened from forks. Fork PRs get no
# secrets, which is why the SDK-restore step is allowed to be a no-op.
permissions:
  contents: read

jobs:
  build:
    name: Build (github debug + release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      # NDK/CMake versions are pinned in app/build.gradle.kts; install the exact versions
      # rather than relying on whatever the runner ships. Retried because sdkmanager
      # downloads occasionally arrive corrupt ("Error on ZipFile unknown archive") on
      # GitHub-hosted runners.
      - name: Install pinned NDK and CMake
        run: |
          for attempt in 1 2 3; do
            sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1" && exit 0
            echo "sdkmanager attempt $attempt failed; retrying in 15s..." >&2
            sleep 15
          done
          echo "sdkmanager failed after 3 attempts" >&2
          exit 1

      - name: Check core translations
        run: python3 scripts/check_localization.py

      # Optional: pull the proprietary ICCOA SDK dex from a *private* repository's release so that
      # pushes to this repository can produce a functional APK. Fork PRs get no secrets, so this
      # step no-ops there and the job stays the documented compile-only check.
      #
      # Requires: secret SDK_REPO (e.g. owner/MiAuto-sdk) and SDK_REPO_TOKEN (a token that can read
      # it), with an asset named `icar-sdk.dex` on that repository's release.
      - name: Restore ICCOA SDK dex (optional)
        env:
          GH_TOKEN: ${{ secrets.SDK_REPO_TOKEN }}
          SDK_REPO: ${{ secrets.SDK_REPO }}
        run: |
          if [ -z "$SDK_REPO" ] || [ -z "$GH_TOKEN" ]; then
            echo "::notice title=Compile check only::SDK_REPO/SDK_REPO_TOKEN not set — this APK will have no CarWith support."
            exit 0
          fi
          mkdir -p app/libs
          gh release download --repo "$SDK_REPO" --pattern icar-sdk.dex --dir app/libs --clobber
          echo "SDK dex restored: $(stat -c%s app/libs/icar-sdk.dex) bytes"

      # Optional: write the release signing key from secrets so the release APK is signed.
      # Generate the base64 with: base64 -w0 headunit-release-key.jks
      - name: Write release signing material (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice title=Unsigned release::RELEASE_KEYSTORE_BASE64 not set — the release APK will be unsigned."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > headunit-release-key.jks
          {
            echo "storeFile=headunit-release-key.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=${KEY_ALIAS:-headunit-revived}"
            echo "keyPassword=${KEY_PASSWORD:-$STORE_PASSWORD}"
          } > key.properties
          echo "Release signing material written."

      # The CarWith / CarLink protocol SDK is a proprietary prebuilt dex and is not in git
      # (see app/libs/README.md). It cannot be carried in a repository secret either:
      # Actions secrets are capped at 48 KB and the dex is ~7 MB.
      #
      # CI is therefore a compile / R8 / test check. Without the dex, injectIccoaDex is
      # skipped and the uploaded APK has no CarWith support — which is why the artifact is
      # labelled accordingly rather than presented as a release candidate.
      - name: Check for the ICCOA SDK dex
        run: |
          if [ -f app/libs/icar-sdk.dex ]; then
            echo "SDK dex present: $(stat -c%s app/libs/icar-sdk.dex) bytes — the build will be functional."
          else
            echo "::notice title=Compile check only::app/libs/icar-sdk.dex is absent, so the packaged APK will not be able to connect to CarWith."
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # github flavor only: the playstore flavor is not covered by this repository's CI.
      # The release variant is compiled here as an R8 / resource-shrinking check; it is
      # left unsigned because key.properties is not in the repository.
      - name: Assemble github debug and release
        run: ./gradlew :app:assembleGithubDebug :app:assembleGithubRelease --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miauto-github-debug-apk
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: warn

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miauto-github-release-apk
          path: app/build/outputs/apk/github/release/*.apk
          if-no-files-found: warn

  unit-test:
    name: Unit tests (github debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      # See the build job for why NDK/CMake are pinned and the install is retried.
      - name: Install pinned NDK and CMake
        run: |
          for attempt in 1 2 3; do
            sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1" && exit 0
            echo "sdkmanager attempt $attempt failed; retrying in 15s..." >&2
            sleep 15
          done
          echo "sdkmanager failed after 3 attempts" >&2
          exit 1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :app:testGithubDebugUnitTest --stacktrace

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testGithubDebugUnitTest
            app/build/test-results/testGithubDebugUnitTest
          if-no-files-found: warn
